<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dither-ork</title>
    <!--
      The only styles in this file are the ones that have to be right before any
      module has loaded: the background, the ink and the font. Everything else
      lives in src/ui/theme.css, imported by the app, so that a theme is one set
      of values in one place (F-UI-09).

      `data-theme` above is the pre-script default. app/theme.ts replaces it as
      soon as it knows the stored mode and the OS preference, which is one frame
      later; starting dark means that frame is not a white flash.
    -->
    <style>
      :root {
        color-scheme: dark;
        background: #0d0f0c;
        color: #cfe8c2;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #boot-noscript {
        padding: 2rem;
        max-width: 60ch;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div id="boot-noscript">
        dither-ork is a WebGPU image application and runs entirely in the
        browser. It needs JavaScript enabled.
      </div>
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
