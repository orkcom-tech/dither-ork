<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dither-ork</title>
    <!--
      The only styles in this file are the ones that have to be right before any
      module has loaded: the background, the ink and the font. Everything else
      lives in src/ui/theme.css, imported by the app, so that a theme is one set
      of values in one place (F-UI-09).

      The four values below are copies of --bg, --fg and the sans family from
      src/ui/theme/tokens.css. They are duplicated rather than imported because
      an @import here would be a second round trip before the first paint, which
      is the flash this block exists to prevent. Change them together.

      `data-theme` above is the pre-script default, and dark is also the default
      the app settles on — see the note in src/ui/theme/tokens.css about why
      that is a decision and not an omission.
    -->
    <style>
      :root {
        color-scheme: dark;
        background: #131519;
        color: #e3e6ec;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      #boot-noscript {
        padding: 2rem;
        max-width: 60ch;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div id="boot-noscript">
        dither-ork is a WebGPU image application and runs entirely in the
        browser. It needs JavaScript enabled.
      </div>
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
