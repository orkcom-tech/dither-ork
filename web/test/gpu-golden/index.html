<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dither-ork GPU golden harness</title>
    <!--
      An empty inline icon, so the browser does not ask for /favicon.ico and the
      static server does not have to answer 404. The harness forwards failed
      loads to stderr now, and a 404 that is always there teaches a reader to
      skip the line that will one day say the module is missing.
    -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!--
      Nothing is drawn here. The page exists so the harness runs on a real
      origin: WebGPU needs a secure context, and the WASM core needs
      cross-origin isolation for its shared memory, neither of which a
      `data:` or `about:blank` document provides.
    -->
    <p>Headless. Driven by <code>web/test/gpu-golden/run.mjs</code> over the DevTools protocol.</p>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
