name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # The GPU reference set is only valid for the environment it was produced
      # in, and this workflow *is* that environment — a pinned Chrome for Testing
      # build on SwiftShader. Blessing from a developer machine works because the
      # browser is pinned, but SwiftShader's JIT emits code for whatever
      # instruction set it finds, so a laptop and a runner are not guaranteed to
      # agree in the last bit. This makes the canonical environment reachable:
      # run it, download the artifact, commit the tree, review the pictures.
      bless_gpu_goldens:
        description: "Re-bless the GPU reference set here and upload it, instead of comparing"
        type: boolean
        default: false

# Toolchain versions are not repeated here. They are read out of
# docker/wasm.Dockerfile, which is the single place they are pinned, so CI and
# local development cannot drift apart without the drift being a code change.
env:
  CARGO_TERM_COLOR: always

jobs:
  # The documentation site is built here as well as in pages.yml, and the
  # duplication is the point: pages.yml runs on a push to main, which is after
  # the change has landed. `docs/site/markdown.mjs` refuses Markdown outside the
  # subset it covers, so a construct nobody checked turns into a failed deploy
  # rather than a bad page — and this is what turns that failed deploy into a red
  # check on the pull request that wrote it. Ten seconds, no install, no cache.
  docs-site:
    name: docs site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/site/build.mjs --out _site

  core:
    name: core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned stable toolchain
        id: pin
        run: |
          version=$(grep -oP '^FROM rust:\K[0-9]+\.[0-9]+' docker/wasm.Dockerfile)
          echo "stable=${version}" >> "$GITHUB_OUTPUT"
          echo "pinned stable: ${version}"

      - name: Install toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.stable }}" \
            --profile minimal --component rustfmt,clippy
          rustup default "${{ steps.pin.outputs.stable }}"
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ steps.pin.outputs.stable }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-${{ steps.pin.outputs.stable }}-

      - run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml --all

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned versions
        id: pin
        run: |
          nightly=$(grep -oP '^ARG RUST_NIGHTLY=\K.+' docker/wasm.Dockerfile)
          wasm_pack=$(grep -oP '^ARG WASM_PACK_VERSION=\K.+' docker/wasm.Dockerfile)
          echo "nightly=${nightly}" >> "$GITHUB_OUTPUT"
          echo "wasm_pack=${wasm_pack}" >> "$GITHUB_OUTPUT"
          echo "pinned nightly: ${nightly}, wasm-pack: ${wasm_pack}"

      - name: Install toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.nightly }}" \
            --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown \
            --toolchain "${{ steps.pin.outputs.nightly }}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            core/target
          key: wasm-${{ steps.pin.outputs.nightly }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: wasm-${{ steps.pin.outputs.nightly }}-

      - name: Install wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null | awk '{print $2}')" = "${{ steps.pin.outputs.wasm_pack }}" ]; then
            echo "wasm-pack ${{ steps.pin.outputs.wasm_pack }} already present"
          else
            cargo install wasm-pack --locked --version "${{ steps.pin.outputs.wasm_pack }}"
          fi

      # Same flags as docker/build-wasm.sh. The atomics and bulk-memory target
      # features plus -Z build-std are what wasm-bindgen-rayon needs; building
      # them here is what proves the pinned nightly still works.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals
        run: |
          rustup run "${{ steps.pin.outputs.nightly }}" wasm-pack build \
            core/crates/dither-wasm \
            --target web \
            --out-dir ../../../web/src/wasm/pkg \
            --out-name dither_wasm \
            -- -Z build-std=panic_abort,std

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
          if-no-files-found: error

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    # The web build resolves the generated WASM package, so it cannot run before
    # that package exists. The ambient declaration in src/types keeps a clean
    # checkout typechecking; it does not make the bundle resolvable.
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      # Before the build, so a red suite is not buried under bundler output.
      # This is the job that runs the catalogue test, which is the acceptance
      # gate for the effect registry: it puts the real startup validator over
      # the shipped descriptors and asserts the per-family, per-execution and
      # per-slot counts. An effect that stops being discovered because a file
      # was renamed is invisible in every other way — nothing errors, the app
      # starts, the stack panel is one row shorter.
      - run: npm test -- --run
        working-directory: web

      - run: npm run build
        working-directory: web

      # The two headers are a hard requirement, and _headers is a plain text
      # file with no schema — a typo in it fails silently in production, where
      # the symptom is the capability check rejecting the app. Assert it here.
      - name: Verify cross-origin isolation headers ship
        run: |
          headers=web/dist/_headers
          test -f "$headers" || { echo "::error::$headers missing from the build output"; exit 1; }
          grep -q 'Cross-Origin-Opener-Policy: same-origin' "$headers" \
            || { echo "::error::COOP header missing or malformed"; exit 1; }
          grep -q 'Cross-Origin-Embedder-Policy: require-corp' "$headers" \
            || { echo "::error::COEP header missing or malformed"; exit 1; }
          echo "both headers present in $headers"

  # Does what was built actually start? Nothing else in this file asks.
  #
  # `web` above builds `dist` and stops there, and a bundle that cannot boot is
  # a bundle that builds perfectly — that is exactly how the render worker
  # shipped as an unbundled `.ts` asset, past a green typecheck, a green suite
  # and a green build. This job loads the built output in the pinned browser and
  # requires it to reach a running editor session. See docs/DEVELOPMENT.md,
  # "Does the built app start?".
  boot:
    name: production build boots
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      # The real production build, not a test-only bundle. The point of this job
      # is that the artefact under test is the artefact that ships.
      - run: npm run build
        working-directory: web

      # The GPU goldens' image: one pinned Chrome for Testing in this
      # repository, not two.
      - name: Build the pinned browser image
        run: docker build -t dither-ork-gpu-golden web/test/gpu-golden

      - name: Boot the built application
        run: |
          docker run --rm -v "$PWD/web:/app/web" \
            dither-ork-gpu-golden node test/boot/run.mjs

  gpu-golden:
    name: gpu golden images
    runs-on: ubuntu-latest
    # The ordered dithers cannot build their passes without a threshold tile from
    # the core, so the harness needs the generated WASM package for the same
    # reason the web build does.
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      # The harness is held to the same strictness as the code it exercises.
      # web/tsconfig.json includes only `src`, so nothing here would otherwise be
      # type-checked at all.
      - name: Typecheck the harness
        run: npx tsc -p test/gpu-golden
        working-directory: web

      - name: Build the harness bundle
        run: npx vite build --config test/gpu-golden/vite.config.ts
        working-directory: web

      # The reference images are valid for one environment and this is it: a
      # pinned Chrome for Testing build driven onto SwiftShader, so the result is
      # a property of that build and not of the machine. docs/ARCHITECTURE.md,
      # "Determinism": the GPU goldens need a pinned environment, since WebGPU
      # implementation variance across drivers is real. Building the image here
      # rather than depending on whatever browser the runner ships is what makes
      # a local run and this job the same run — the version is one line in
      # web/test/gpu-golden/chrome-version.txt, read by the Dockerfile and
      # asserted by the harness.
      - name: Build the pinned browser image
        run: docker build -t dither-ork-gpu-golden web/test/gpu-golden

      - name: Compare against the reference set
        if: ${{ !inputs.bless_gpu_goldens }}
        run: |
          docker run --rm \
            -e DITHER_ORK_GOLDEN_ARTIFACTS=/app/web/test/gpu-golden/failed \
            -v "$PWD/web:/app/web" \
            dither-ork-gpu-golden

      # Only on failure, and only what failed. A message saying a third of the
      # frame moved cannot say the halftone screen came out rotated; the picture
      # can.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gpu-golden-failures
          path: web/test/gpu-golden/failed
          if-no-files-found: ignore

      # The manual path. Nothing is committed from CI — the tree comes back as an
      # artifact so a human puts it in a reviewed commit, which is the only way a
      # picture changing is ever a decision somebody made.
      - name: Re-bless the reference set
        if: ${{ inputs.bless_gpu_goldens }}
        run: |
          docker run --rm -e DITHER_ORK_BLESS=1 -v "$PWD/web:/app/web" dither-ork-gpu-golden

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.bless_gpu_goldens }}
        with:
          name: gpu-golden-blessed
          path: web/fixtures/gpu
          if-no-files-found: error
